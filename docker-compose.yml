services:
  lich-server:
    build:
      context: ./lich-server
      dockerfile: Dockerfile
    image: lich-server:latest
    container_name: lich-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - lich-data:/data

volumes:
  lich-data:
    driver: local
