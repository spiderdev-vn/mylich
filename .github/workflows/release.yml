name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Binary (${{ matrix.target.os }}/${{ matrix.target.arch }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lich-cli
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64, name: lich-linux-amd64 }
          - { os: linux, arch: arm64, name: lich-linux-arm64 }
          - { os: darwin, arch: amd64, name: lich-darwin-amd64 }
          - { os: darwin, arch: arm64, name: lich-darwin-arm64 }
          - { os: windows, arch: amd64, name: lich-windows-amd64.exe }
          - { os: windows, arch: arm64, name: lich-windows-arm64.exe }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o "${{ matrix.target.name }}" ./cmd/lich

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.name }}
          path: ./lich-cli/${{ matrix.target.name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./binaries/**/*
          generate_release_notes: true
