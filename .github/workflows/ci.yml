name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Kiểm thử và lint Server (Node.js 24 LTS)
  server-test:
    name: Lich Server (Ubuntu - Node 24.x)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lich-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          cache-dependency-path: ./lich-server/package.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Run automated tests
        run: npm test

  # 2. Kiểm thử và biên dịch Go Client / TUI (lich-cli) trên 3 OS chính
  cli-test:
    name: Lich CLI (${{ matrix.os }} - Go 1.26)
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./lich-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: ./lich-cli/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run Go tests (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

      - name: Build binary
        run: go build -v -o bin/lich ./cmd/lich
