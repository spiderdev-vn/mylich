name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Kiểm thử và kiểm tra Server (Node.js + Fastify + SQLite)
  server-test:
    name: Lich Server (${{ matrix.os }} - Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./lich-server
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        node-version: [ 22.x, 24.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ./lich-server/package.json

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

  # 2. Kiểm thử và biên dịch Go Client / TUI (lich-cli)
  cli-matrix:
    name: Lich CLI (${{ matrix.os }} - Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./lich-cli
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        go-version: [ '1.22', '1.23', '1.24' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ./lich-cli/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v -race ./...
        # Windows & macOS supported; -race is active on amd64/arm64
        if: matrix.os != 'windows-latest'

      - name: Run Go tests (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

      - name: Build binary
        run: go build -v -o bin/lich ./cmd/lich
